<div class="flex flex-wrap items-center gap-3">
  <p-select
    [formField]="searchForm.language"
    [options]="languages"
    optionLabel="label"
    optionValue="key"
    optionDisabled="disabled"
    class="w-20"
  />

  <!-- Only the search box sits in the <form>: Enter submits a form implicitly only when it has a
       single text field, and the pickers here carry inputs of their own. They still edit the same
       form model through [formField]. -->
  <form [formRoot]="searchForm" class="max-w-sm min-w-xl flex-1">
    <p-iconfield>
      <p-inputicon>
        <svg data-p-icon="search"></svg>
      </p-inputicon>
      <input
        #searchInput
        pInputText
        type="text"
        placeholder="Search a word…"
        class="w-full"
        [formField]="searchForm.word"
      />
      @if (store.query().word) {
        <p-inputicon class="cursor-pointer" (click)="store.clearSearch()">
          <svg data-p-icon="times"></svg>
        </p-inputicon>
      } @else {
        <p-inputicon>
          <kbd class="text-xl leading-none! font-medium">↵</kbd>
        </p-inputicon>
      }
    </p-iconfield>
  </form>

  <p-select
    [formField]="searchForm.sources"
    [options]="store.availableSources()"
    optionLabel="label"
    optionValue="key"
    [multiple]="true"
    [checkmark]="true"
    placeholder="Sources"
    class="w-56"
  />

  <app-deck-picker />

  <button
    pButton
    type="button"
    severity="secondary"
    outlined
    [disabled]="store.pushingStyling()"
    title="Push the current card styling to Anki's {{
      store.languageLabel()
    }}-Dictionary note type - doesn't add or change any card"
    (click)="store.pushStyling()"
  >
    <svg data-p-icon="refresh" class="size-4"></svg>Update Anki styling
  </button>

  <button
    pButton
    type="button"
    severity="secondary"
    outlined
    [disabled]="!store.canSwapSides()"
    title="Swap everything checked and arranged between Front and Back"
    (click)="store.swapSides()"
  >
    <svg data-p-icon="arrows-h" class="size-4"></svg>Swap Front/Back
  </button>

  <button
    pButton
    type="button"
    class="ml-auto"
    [disabled]="!store.canSave() || store.saving()"
    [title]="
      !store.canSave()
        ? 'Pick a deck and put at least one thing on both Front and Back'
        : store.isEditing
          ? 'Save changes to this card'
          : 'Add this card to the selected deck'
    "
    (click)="store.save()"
  >
    <svg data-p-icon="plus" class="size-4"></svg
    >{{ store.isEditing ? 'Save changes' : 'Add to Anki' }}
  </button>
</div>
