<div class="flex flex-wrap items-center justify-between gap-3">
  <span class="text-xs font-semibold tracking-wide text-(--p-text-muted-color) uppercase"
    >Card preview</span
  >
  <span class="flex items-center gap-1">
    @for (device of devices; track device.value) {
      <button
        pButton
        size="small"
        type="button"
        [text]="store.previewDevice() !== device.value"
        [attr.aria-pressed]="store.previewDevice() === device.value"
        (click)="store.setPreviewDevice(device.value)"
      >
        @if (device.value === 'phone') {
          <svg data-p-icon="mobile" class="size-3.5"></svg>
        } @else {
          <svg data-p-icon="desktop" class="size-3.5"></svg>
        }
        {{ device.label }}
      </button>
    }
  </span>
</div>

@if (preview()) {
  <!-- Phone mode narrows the card to a phone's width and applies the phone text size. -->
  <div
    [cardHtml]="preview()"
    [class]="
      store.previewDevice() === 'phone'
        ? 'pd-phone mx-auto w-[375px] max-w-full rounded-2xl border border-surface-200 p-3 dark:border-surface-700'
        : ''
    "
  ></div>
} @else {
  <p class="text-sm text-(--p-text-muted-color)">
    Check fields in the results to preview them here.
  </p>
}
