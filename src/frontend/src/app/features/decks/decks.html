<div class="flex w-full max-w-2xl flex-col gap-4">
  <div class="flex items-center justify-between">
    <h1 class="text-lg font-semibold">Decks</h1>
    <a pButton size="small" routerLink="/cards/new">
      <svg data-p-icon="plus"></svg>
      New
    </a>
  </div>

  <div class="overflow-hidden rounded-lg border border-surface-200 dark:border-surface-700">
    <p-treetable
      [value]="decks.deckTree()"
      [loading]="isLoading()"
      dataKey="key"
      tableStyleClass="w-full text-sm"
    >
      <ng-template #header>
        <tr>
          <th>Deck</th>
          <th class="w-20 text-right">New</th>
          <th class="w-20 text-right">Learn</th>
          <th class="w-20 text-right">Due</th>
        </tr>
      </ng-template>
      <ng-template #body let-rowNode let-node="node" let-deck="rowData">
        @let counts = countsFor(deck);
        <tr>
          <td class="flex items-center gap-1">
            <p-treetable-toggler [rowNode]="rowNode" />
            {{ node.label }}
          </td>
          <td class="text-right" [class]="counts.new ? 'text-blue-500' : 'text-gray-500'">
            {{ counts.new }}
          </td>
          <td class="text-right" [class]="counts.learn ? 'text-red-500' : 'text-gray-500'">
            {{ counts.learn }}
          </td>
          <td class="text-right" [class]="counts.due ? 'text-green-600' : 'text-gray-500'">
            {{ counts.due }}
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="px-4 py-6 text-center text-surface-500">
            {{ isLoading() ? 'Loading decks…' : 'No decks found.' }}
          </td>
        </tr>
      </ng-template>
    </p-treetable>
  </div>

  @if (error(); as error) {
    <span class="text-xs text-red-500">{{ error }}</span>
  }
</div>
