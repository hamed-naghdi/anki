<!-- overflow-clip, not overflow-hidden: it clips the off-canvas sidebar the same way, but doesn't
     become a scroll container - which would stop the card editor's sticky preview from sticking. -->
<div class="overflow-clip">
  <p-sidebar-layout class="min-h-dvh! relative!">
    @if (isMobile() && navOpen()) {
      <p-sidebar-backdrop class="absolute!" />
    }
    <p-sidebar
      id="nav"
      side="left"
      [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
      [overlay]="isMobile()"
      [(open)]="navOpen"
      width="9rem"
    >
      <p-sidebar-spacer />
      <p-sidebar-aside>
        <p-sidebar-panel>
          <p-sidebar-header>
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <button pSidebarMenuButton class="p-1!">
                  <div
                    class="flex size-8 shrink-0 items-center justify-center rounded-md bg-linear-to-br from-violet-500 to-indigo-600 text-white text-s font-bold leading-none"
                  >
                    Anki
                  </div>
                  <span class="font-semibold text-sm">Dictionary</span>
                </button>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-header>
          <p-sidebar-content>
            <p-sidebar-group>
              <p-sidebar-group-label>Navigation</p-sidebar-group-label>
              <p-sidebar-group-content>
                <p-sidebar-menu>
                  <p-sidebar-menu-item>
                    <button
                      pSidebarMenuButton
                      routerLink="/"
                      routerLinkActive
                      #decksLink="routerLinkActive"
                      [routerLinkActiveOptions]="{ exact: true }"
                      [isActive]="decksLink.isActive"
                    >
                      <svg data-p-icon="home"></svg>
                      <span>Decks</span>
                    </button>
                  </p-sidebar-menu-item>
                  <p-sidebar-menu-item>
                    <button
                      pSidebarMenuButton
                      routerLink="/cards"
                      routerLinkActive
                      #cardsLink="routerLinkActive"
                      [isActive]="cardsLink.isActive"
                    >
                      <svg data-p-icon="clone"></svg>
                      <span>Cards</span>
                    </button>
                  </p-sidebar-menu-item>
                </p-sidebar-menu>
              </p-sidebar-group-content>
            </p-sidebar-group>
          </p-sidebar-content>
        </p-sidebar-panel>
      </p-sidebar-aside>
    </p-sidebar>
    <p-sidebar-main class="min-w-0">
      <header
        class="flex h-12 items-center gap-2 border-b border-surface-200 dark:border-surface-700 px-4"
      >
        <button pButton pSidebarTrigger target="nav" severity="secondary" text size="small">
          <svg data-p-icon="sidebar"></svg>
        </button>
        <span class="text-sm font-medium flex-1">{{ pageTitle() }}</span>
      </header>
      <div class="flex-1 p-4 flex flex-col gap-4">
        <router-outlet />
      </div>
    </p-sidebar-main>
  </p-sidebar-layout>
</div>

<!-- The app's one toast outlet (see core/toasts.ts). A custom template so a toast can carry action
     buttons, e.g. "Show in Anki" after adding a card. -->
<p-toast position="top-right">
  <ng-template #message let-message let-close="closeFn">
    <div class="flex min-w-0 flex-1 flex-col gap-1">
      <span class="font-semibold">{{ message.summary }}</span>
      @if (message.detail) {
        <span class="text-sm">{{ message.detail }}</span>
      }
      @if (toastData(message.data).actions; as actions) {
        <span class="mt-1 flex gap-3">
          @for (action of actions; track action.label) {
            <button
              type="button"
              class="cursor-pointer text-sm font-medium underline"
              (click)="action.run(); close($event)"
            >
              {{ action.label }}
            </button>
          }
        </span>
      }
    </div>
  </ng-template>
</p-toast>
