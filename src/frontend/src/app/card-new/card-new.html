<div
  class="rounded-lg border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 p-3 flex flex-wrap items-center gap-3"
>
  <div class="flex flex-1 min-w-56 max-w-sm items-center gap-1">
    <p-iconfield class="flex-1">
      <p-inputicon>
        <svg data-p-icon="search"></svg>
      </p-inputicon>
      <input
        pInputText
        type="text"
        placeholder="Search a word…"
        class="w-full"
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
        (keyup.enter)="onSearch()"
      />
    </p-iconfield>

    @if (searchTerm()) {
      <button pButton type="button" severity="secondary" text size="small" (click)="onClearSearch()" aria-label="Clear search">
        <svg data-p-icon="times"></svg>
      </button>
    }

    <button pButton type="button" size="small" (click)="onSearch()" aria-label="Search">
      <svg data-p-icon="search"></svg>
    </button>
  </div>

  <div class="flex flex-col gap-1">
    <p-select
      [options]="deckService.decks()"
      [ngModel]="deckService.selectedDeck()"
      (ngModelChange)="deckService.selectDeck($event)"
      [loading]="deckService.isLoading()"
      placeholder="Deck"
      class="w-48"
    />
    @if (deckService.error(); as deckError) {
      <span class="text-xs text-red-500">{{ deckError }}</span>
    }
  </div>

  <div class="flex flex-col gap-1">
    <p-select
      [options]="noteTypeService.noteTypes()"
      [ngModel]="noteTypeService.selectedNoteType()"
      (ngModelChange)="noteTypeService.selectNoteType($event)"
      [loading]="noteTypeService.isLoading()"
      placeholder="Note type"
      class="w-48"
    />
    @if (noteTypeService.error(); as noteTypeError) {
      <span class="text-xs text-red-500">{{ noteTypeError }}</span>
    }
  </div>

  <button pButton type="button" severity="secondary" text size="small" class="ml-auto" aria-label="Settings">
    <svg data-p-icon="cog"></svg>
  </button>
</div>
<div class="rounded-lg bg-surface-100 dark:bg-surface-800 flex-1">Bottom</div>
